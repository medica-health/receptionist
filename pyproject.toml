[project]
name = "receptionist"
version = "0.1.0"
description = "Twilio voice receptionist for the MediCare appointment system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain-anthropic",
    "twilio",
    "psycopg[binary,pool]",
    "redis",
    "httpx",
    "pydantic-settings",
    "rapidfuzz",
    "bcrypt>=5.0.0",
]

[project.scripts]
receptionist = "receptionist.cli:main"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "lupa>=2.8",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receptionist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQL and Lua kept line-for-line with express-api's copies.
"src/receptionist/backend/holds.py" = ["E501"]
"src/receptionist/backend/store.py" = ["E501"]
